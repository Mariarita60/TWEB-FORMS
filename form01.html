<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Inscrição nos jogos escolares</h1>
        <p> Preencha os campos abaixo com suas informações.</p>
    </header>

   <form id="inscricao-jogos" action="/inscricoes-jogos" method="post" enctype="multipart/form-data">
        
        
        
        <fieldset>
            <legend> 01 Identificação do Atleta</legend>
        <label for="nome-atleta">Nome completo do(a) atleta (*Obrigatório)</label>
        <input type="text" id="nome-atleta" name="nome_atleta" required>
        <br><br>
        <label for="nome-social">Nome Social</label>
        <input type="text" id="nome-social" name="nome_social">
        <br><br>
        <label for="matricula-atleta">Matrícula (*Obrigatório)</label>
        <input type="text" id="matricula-atleta" name="matricula_atleta" required>
        <br><br>
        <label for="email-atleta">E-mail para contato</label>
        <input type="email" id="email-atleta" name="email_atleta" required>
        <br><br>
        <label for="telefone-atleta">Telefone para contato (*Obrigatório)</label>
        <input type="tel" id="telefone-atleta" name="telefone_atleta" required>
        <br><br>
        <label for="data-nascimento-atleta">Data de nascimento (*Obrigatório)</label>
        <input type="date" id="data-nascimento-atleta" name="data_nascimento_atleta" required>
        <br><br>
        <label for="site-escola">Site da Escola</label>
        <input type="text" id="site-escola" name="site_escola" required>
        <br><br>

    <fieldset>
        <legend> 02 Escola e Deleganção </legend>
        <label for="Escola-atleta"> Escola de Origem</label>
        <input type="search" id="escola" name="escolas" list="escolas">
        <datalist id="escolas">
                    <option value="Escola Municipal"></option>
                    <option value="Escola Estadual"></option>
                    <option value="Instituto Federal"></option> 

    <br><br>

            
    </fieldset>
    

    </form>

</body>
</html>
